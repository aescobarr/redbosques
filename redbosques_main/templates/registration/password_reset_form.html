{% extends "redbosques_main/base.html" %}
{% block main %}
    <div class="container col-lg-offset-4 col-lg-4">
        <h3>Restablecer contraseña</h3>
        <p>¿Has olvidado tu clave? Introduce tu dirección de correo a continuación y te enviaremos vía email las instrucciones para establecer una nueva.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
        <button type="submit">Enviar</button>
        </form>
    </div>
{% endblock %}
