{% extends "redbosques_main/base.html" %}
{% load static %}
{% block extra_css %}

{% endblock %}
{% block main %}
<div class="container-fluid subheader">
    <div class="row">
        <div class="col-lg-12 subfield">

                <h4>
                    <a href="{% url 'index' %}">Inicio</a> /
                    Menú
                </h4>

            <h2>{{ herramientas }}</h2>
        </div>
    </div>
</div>
<div class="container menu-header">
    <div class="row">
        <h3>Menú principal</h3>
    </div>
</div>
<div class="container menuOptions">
    <div class="row">
        <div class="col-lg-offset-4 col-lg-4">
            <a class="btn btn-selector-mapa" href="{% url 'herramientas' %}">Ver mapa de rodales</a>
            <button type="btn" class="btn btn-selector-mapa" disabled>Entrada de nuevo rodal</button>
            <button type="btn" class="btn btn-selector-mapa" disabled>Importar datos desde xls? Csv?</button>
            <button type="btn" class="btn btn-selector-mapa" disabled>Editar Rodal</button>
            <select class="form-control rodalSelected">
                <option value="" selected="selected">------</option>
                    {% for rodal in rodalesSelector %}
                        <option class="tipo_bosque" value="{{ rodal.id_rodal }}">
                            {{ rodal.nombre }}
                        </option>
                    {% endfor %}
            </select>
            <button type="btn" class="btn btn-selector-mapa" disabled>Exportar (csv?, shp?, sql?)</button>
            <button type="btn" class="btn btn-selector-mapa" disabled>Crear PDF</button>
            <button type="btn" class="btn btn-selector-mapa" onclick="compararRodal()">Comparar</button>
            <!--<button type="btn" class="btn btn-selector-mapa">Terminar</button>-->
            <a class="btn btn-selector-mapa" href="{% url 'logout' %}">Salir</a>
        </div>

    </div>
</div>

{% endblock %}
{% block extra_js %}
<script src="{% static 'redbosques_main/javascript/csrf_utils.js' %}"></script>
<script src="{% static 'redbosques_main/javascript/menu.js' %}"></script>
{% endblock %}
