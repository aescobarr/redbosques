{% extends "redbosques_main/base.html" %}
{% load static %}
{% block extra_css %}

{% endblock %}
{% block main %}
<div class="container-fluid subheader">
    <div class="row">
        <a href="/redbosques"><h4>Inicio</h4></a>
        <h2>{{ herramientas }}</h2>
    </div>
</div>

<div class="container menu-header">
    <div class="row">
        <h3>Menú principal</h3>
    </div>
</div>
<div class="container menuOptions">
    <div class="row">
        <div class="col-lg-offset-4 col-lg-4">

            <button type="btn" class="btn btn-selector-mapa">Entrada de nuevo rodal</button>
            <button type="btn" class="btn btn-selector-mapa">Importar datos desde xls? Csv?</button>
            <button type="btn" class="btn btn-selector-mapa">Editar Rodal</button>
            <select class="form-control rodalSelected">
                <option type="radio" value="875">Can Moix (411101)</option>
                <option type="radio" value="844">Pinarisses (370271)</option>
                <option type="radio" value="771">Bosc de Petit (260781)</option>
                <option type="radio" value="683">La Trona (150361)</option>
                <option type="radio" value="739">Corriol (240451)</option>
            </select>
            <button type="btn" class="btn btn-selector-mapa">Exportar (csv?, shp?, sql?)</button>
            <button type="btn" class="btn btn-selector-mapa">Crear PDF</button>
            <button type="btn" class="btn btn-selector-mapa" onclick="compararRodal()">Comparar</button>
            <button type="btn" class="btn btn-selector-mapa">Terminar</button>
        </div>

    </div>
</div>

{% endblock %}
{% block extra_js %}
<script src="{% static 'redbosques_main/javascript/csrf_utils.js' %}"></script>
<script src="{% static 'redbosques_main/javascript/menu.js' %}"></script>
{% endblock %}
