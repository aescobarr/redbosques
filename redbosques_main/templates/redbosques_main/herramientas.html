{% extends "redbosques_main/base.html" %}
{% load static %}
{% block extra_css %}
<link href="{% static 'redbosques_main/Leaflet.markercluster-1.4.0/dist/MarkerCluster.css' %}" rel="stylesheet">
<link href="{% static 'redbosques_main/Leaflet.markercluster-1.4.0/dist/MarkerCluster.Default.css' %}" rel="stylesheet">
{% endblock %}
{% block main %}
<div class="container-fluid subheader">
    <div class="row">
        <div class="col-lg-12 subfield">
            <a href="/redbosques"><h4>Inicio</h4></a>
            <h2>{{ herramientas }}</h2>
            <!--<h2>Herramienta de evaluación de rodales maduros</h2>-->
        </div>
    </div>
</div>

<div class="container map-header">
    <div class="row">
        <h3>Mapa de rodales de referencia RedBosques</h3>
    </div>
</div>
<div class="container">
    <div class="row mapa-selectores">
        <div id="mapid" class="col-lg-9"></div>

        <div class="col-lg-3">
            <button class="btn btn-selector-mapa" disabled>Participar</button>
            <!--<button type="btn" class="btn btn-selector-mapa">Comparar</button>-->

            <!--<button class="btn btn-selector-mapa selectorFiltro" onclick="changeFilter()" value="0">Valoración Humana</button>-->

            <!--<div class="seleccio_rodal">
                <h5>Selecciona un rodal</h5>
                <select class="form-control selector_rodal" onchange="updateMapData()">
                    <option value="" selected="selected">------</option>
                    {% for rodal in llista_punts %}
                        <option class="rodal" value="{{ rodal.id }}">
                            {{ rodal.nombre }}
                        </option>
                        {% endfor %}
                </select>
            </div>-->

            <div class="seleccio_habitat">
                <div class="habitatd">
                    <h5>Hábitat:</h5>
                        <!--<select class="form-control tipo_habitat" onclick="updateMapData()">-->
                        <select class="form-control tipo_habitat" onchange="habitatData()">
                            <option value="" selected="selected">------</option>
                            {% for habitat in habitatData %}
                            <option class="tipo_bosque" value="{{ habitat.cod }}">
                                {{ habitat.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    <h5>Subhábitat:</h5>
                        <select class="form-control tipo_habitat_sel" onchange="subHabitatData()">
                            <option value="" selected="selected">------</option>
                            {% for subHabitat in subHabitatData %}
                            <option class="tipo_bosque" value="{{ subHabitat.cod }}">
                                {{ subHabitat.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    <h5>Rodal:</h5>
                        <!--<select class="form-control selector_rodal" onchange="updateMapData()">-->
                        <select class="form-control selector_rodal" onchange="rodalData()">
                            <option value="" selected="selected">------</option>
                            {% for rodal in rodalesData %}
                                <option class="rodal" value="{{ rodal.id_rodal }}">
                                    {{ rodal.nombre }}
                                </option>
                                {% endfor %}
                        </select>
                </div>

                <!--<div class="valoracion">
                    <h5>Valoración</h5>
                    <form class="checkbox selector_valoracion"></form>
                </div>-->
            </div>
            <div class="limpiarFiltros">
                    <button class="btn btn-selector-mapa" onclick="limpiarFiltros()">Limpiar filtros</button>
            </div>

            <h5>Opciones de visualización</h5>
            <select class="form-control selector_clasificacio" onclick="updateMapData()">
                <option class="tip_clas" value="nm" selected="selected">Naturalidad</option>
                <option class="tip_clas" value="hh">Huella humana</option>
                <option class="tip_clas" value="ie">Integridad espacial</option>

            </select>
        </div>

    </div>


</div>
{% endblock %}

        {% block extra_js %}
        <script>
        var mymap;
        var testData;
        var url = "{% url 'datos_mapa' %}";
        var marker_cluster;
        var puntuacion={};
        var setMapData;
        var url_data;
        var treeIcon;
        var id_tipo_habitat_sel;
        var id_tipo_habitat;
        var codi_rodal;






        </script>
        <script src="{% static 'redbosques_main/javascript/csrf_utils.js' %}"></script>
        <script src="{% static 'redbosques_main/leaflet/leaflet.js' %}"></script>
        <script src="{% static 'redbosques_main/Leaflet.markercluster-1.4.0/dist/leaflet.markercluster.js' %}"></script>
        <script src="{% static 'redbosques_main/javascript/leaflet-bing-layer.min.js' %}"></script>
        {% endblock %}
